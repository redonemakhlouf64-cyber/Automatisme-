name: Nyx Social - Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build --workspace=@nyx/dashboard

      - name: Save dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: nyx-social-dashboard
          path: apps/dashboard/.next/
          if-no-files-found: error
          retention-days: 7
