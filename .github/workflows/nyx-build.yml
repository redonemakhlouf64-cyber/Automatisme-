name: Nyx Social - Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build --workspace=@nyx/dashboard

      - name: Inspect dashboard build output
        if: always()
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== ROOT ==="
          ls -la
          echo "=== apps ==="
          ls -la apps || true
          echo "=== dashboard ==="
          ls -la apps/dashboard || true
          echo "=== ALL BUILD DIRECTORIES ==="
          find apps/dashboard -maxdepth 3 -type d \\( -name ".next" -o -name "dist" -o -name "build" \\) -print 2>/dev/null || true
          echo "=== NEXT FILES ==="
          find apps/dashboard/.next -maxdepth 2 -type f 2>/dev/null | head -80 || true

      - name: Save dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: nyx-social-dashboard
          path: apps/dashboard/.next/
          if-no-files-found: error
          retention-days: 7
