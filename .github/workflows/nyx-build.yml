name: Nyx Social - Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build --workspace=@nyx/dashboard

      - name: Inspect dashboard build output
        if: success()
        run: |
          echo "=== Dashboard directory ==="
          ls -la apps/dashboard
          echo "=== Next.js output ==="
          if [ -d apps/dashboard/.next ]; then
            echo "NEXT_DIR_EXISTS=true"
            du -sh apps/dashboard/.next
            find apps/dashboard/.next -maxdepth 2 -type f | head -80
          else
            echo "NEXT_DIR_EXISTS=false"
            exit 1
          fi

      - name: Save dashboard build
        uses: actions/upload-artifact@v4
        with:
          name: nyx-social-dashboard
          path: apps/dashboard/.next/
          if-no-files-found: error
          retention-days: 7
