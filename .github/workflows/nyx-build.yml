name: Nyx Social - Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build --workspace=@nyx/dashboard

      - name: Inspect dashboard build output
        if: always()
        shell: bash
        run: |
          echo "=== Workspace ==="
          pwd
          ls -la || true
          echo "=== Dashboard ==="
          ls -la apps/dashboard || true
          echo "=== Build output directories ==="
          find apps/dashboard -maxdepth 3 -type d \( -name ".next" -o -name "dist" -o -name "build" \) -print 2>/dev/null || true
          echo "=== Next.js output files ==="
          find apps/dashboard/.next -maxdepth 2 -type f -print 2>/dev/null | head -80 || true

      - name: Save dashboard build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyx-social-dashboard
          path: apps/dashboard/.next/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
